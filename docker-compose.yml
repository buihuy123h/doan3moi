# Nexus Service Marketing System — full stack
# Dùng: docker compose up -d --build
#   sqlserver  : SQL Server 2022 (seed tự nạp lần đầu qua service sqlserver-init)
#   mongodb    : MongoDB (chat + OTP + lịch sử thông báo)
#   api        : ASP.NET Core backend (doanki3API), cổng 5105
#   web        : Frontend Svelte build bởi Vite, phục vụ bằng nginx, cổng 3000
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Nexus@12345
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Nexus@12345' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Nexus@12345' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # Nạp schema + seed (NexusSystem_Database.sql) lần đầu khi DB còn trống.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nexus_sqlserver_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./frontend/NexusSystem_Database.sql:/scripts/NexusSystem_Database.sql:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd; [ -x $$SQLCMD ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd
        if $$SQLCMD -S sqlserver -U sa -P 'Nexus@12345' -C -h -1 -Q "SET NOCOUNT ON; SELECT CASE WHEN DB_ID('NexusSystem') IS NULL THEN 0 ELSE 1 END" | grep -q 1; then
          echo 'NexusSystem da ton tai — bo qua seed.'
        else
          echo 'Dang tao DB NexusSystem tu NexusSystem_Database.sql...'
          $$SQLCMD -S sqlserver -U sa -P 'Nexus@12345' -C -i /scripts/NexusSystem_Database.sql
        fi
    restart: "no"

  mongodb:
    image: mongo:latest
    container_name: nexus_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  api:
    build: ./backend/doanki3API
    container_name: nexus_api
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5105
      # Ghi đè connection strings của appsettings.json để trỏ vào container
      - ConnectionStrings__MyAppDbContext=Server=sqlserver;Database=NexusSystem;User Id=sa;Password=Nexus@12345;Trust Server Certificate=True
      - Mongo__ConnectionString=mongodb://mongodb:27017
    ports:
      - "5105:5105"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5105
    container_name: nexus_web
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  sqlserver_data:
  mongodb_data:
